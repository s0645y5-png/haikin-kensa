<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1b5bc9" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#173563" media="(prefers-color-scheme: dark)"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="配筋検査">
<title>配筋検査アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-hand field tool — sticky header, one member per screen, big tap targets, bottom tab bar */
:root{
  --bg:#e8eef8; --surface:#ffffff; --sunk:#f2f6fc; --ink:#13213a; --muted:#52627a; --line:#cdd8e8;
  --accent:#1b5bc9; --accent-ink:#ffffff; --accent-soft:#e3ecfb;
  --hd:#1b5bc9; --hd-ink:#ffffff; --hd-muted:#d3e1fa; --hd-track:rgba(255,255,255,.28);
  --ok:#17834a; --ok-soft:#dff3e7; --ng:#cf3527; --ng-soft:#fde5e2; --na:#76859b; --na-soft:#e9eef6;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"Barlow Condensed","BIZ UDPGothic","Arial Narrow",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1522; --surface:#152033; --sunk:#111a2a; --ink:#e3eaf5; --muted:#97a6bd; --line:#26344c;
  --accent:#6d9eff; --accent-ink:#0d1420; --accent-soft:#1a2c4d;
  --hd:#173563; --hd-ink:#ffffff; --hd-muted:#b4c8ea; --hd-track:rgba(255,255,255,.18);
  --ok:#4cc380; --ok-soft:#173326; --ng:#ff6d60; --ng-soft:#3a1d1a; --na:#8595ab; --na-soft:#1f2a3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1522; --surface:#152033; --sunk:#111a2a; --ink:#e3eaf5; --muted:#97a6bd; --line:#26344c;
  --accent:#6d9eff; --accent-ink:#0d1420; --accent-soft:#1a2c4d;
  --hd:#173563; --hd-ink:#ffffff; --hd-muted:#b4c8ea; --hd-track:rgba(255,255,255,.18);
  --ok:#4cc380; --ok-soft:#173326; --ng:#ff6d60; --ng-soft:#3a1d1a; --na:#8595ab; --na-soft:#1f2a3c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);color:var(--hd-ink);padding:10px 16px 8px;border-bottom:1px solid var(--hd);display:grid;gap:6px}
header.top .bar{background:var(--hd-track)}
header.top .bar i:nth-child(3){background:var(--hd-ink)!important}
header.top .top-meta{color:var(--hd-muted)}
header.top :focus-visible{outline-color:var(--hd-ink)}
.top-row{display:flex;align-items:center;gap:10px}
.top-row select{flex:1;min-width:0;font-weight:700;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.top-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
main{flex:1;padding:12px 16px 96px;display:grid;gap:14px;align-content:start}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
nav.tabs button{background:none;border:0;padding:8px 0 6px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);border-radius:8px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="true"]{color:var(--accent);font-weight:700}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--ng);color:#fff;font-size:11px;line-height:18px;text-align:center}

/* member list */
.sec h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:4px 2px 8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.mbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 9px;text-align:left;display:grid;gap:1px;position:relative;min-height:66px}
.mbtn .sym{font-family:var(--f-num);font-weight:600;font-size:22px;line-height:1.05}
.mbtn .loc{font-size:12px;color:var(--muted)}
.mbtn .st{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.mbtn[data-s="part"] .st{background:var(--accent)}
.mbtn[data-s="done"]{border-color:var(--ok)}
.mbtn[data-s="done"] .st{background:var(--ok)}
.mbtn[data-s="ng"]{border-color:var(--ng);background:var(--ng-soft)}
.mbtn[data-s="ng"] .st{background:var(--ng)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}

/* member card */
.card-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.card-head .sym{font-family:var(--f-num);font-weight:700;font-size:44px;line-height:.95}
.card-head .loc{font-size:15px;color:var(--muted)}
.kind{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.design{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;align-items:baseline;min-width:0;margin:0}
#app.nodata header.top,#app.nodata nav.tabs{display:none}
.welcome{display:grid;gap:14px;padding:32px 4px;max-width:520px;margin:0 auto}
.welcome h1{margin:0;font-size:26px}
.welcome p{margin:0;line-height:1.7}
.welcome .filebtn{padding:16px;font-size:17px;text-align:center}
.dz{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.dz .design{align-content:start}
/* 断面リストの窓：ページ全体の画像を部材枠に合わせて拡大表示 */
.sectwin{position:relative;overflow:hidden;width:132px;min-height:150px;padding:0;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;display:block}
@media (min-width:560px){.sectwin{width:230px;min-height:210px}}
.sectwin img,.sv-wrap img{position:absolute;left:0;top:0;max-width:none;user-select:none;-webkit-user-drag:none}
.sectwin .frame,.sv-wrap .frame{position:absolute;border:3px solid #f2a100;border-radius:3px;box-shadow:0 0 0 2000px rgba(255,255,255,.18);pointer-events:none}
.sectwin .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(19,33,58,.78);color:#fff;font-size:11px;padding:2px 6px;text-align:left;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 全画面ビューアー */
.sv{position:fixed;inset:0;z-index:70;background:#2a3038;display:flex;flex-direction:column}
.sv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#16202a;color:#fff}
.sv-bar b{flex:1 0 100%;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-bar button{flex:1;background:#fff;color:#16202a;border:0;border-radius:8px;min-width:44px;height:38px;font-weight:700;padding:0 8px}
.sv-box{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
.sv-wrap{position:relative;background:#fff}
.sv-hint{color:#c9d1d9;font-size:12px;text-align:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.design dt{font-size:12px;color:var(--muted)}
.design dd{margin:0;font-family:var(--f-num);font-weight:600;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.design dd small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.grp-h b{font-size:14px}
.grp-h .dv{font-family:var(--f-num);font-weight:600;font-size:16px;text-align:right;min-width:0}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .lbl{flex:1;min-width:0;font-size:15px}
.row[data-v="ok"]{background:var(--ok-soft)}
.row[data-v="ng"]{background:var(--ng-soft)}
.row[data-v="na"]{background:var(--na-soft)}
.row .fno{font-size:11px;color:var(--ng);font-weight:700;margin-left:6px}
.seg{display:flex;gap:6px}
.seg button{width:48px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--muted);display:grid;place-items:center}
.seg button[data-k="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-k="ng"][aria-pressed="true"]{background:var(--ng);border-color:var(--ng);color:#fff}
.seg button[data-k="na"][aria-pressed="true"]{background:var(--na);border-color:var(--na);color:#fff}
.card-foot{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:25;max-width:760px;margin:0 auto;padding:8px 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.btn:disabled{opacity:.4}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;justify-self:start}
.refbtn{background:none;border:1px solid var(--line);border-radius:16px;padding:3px 10px;font-size:12px;color:var(--muted)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(8,16,32,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet h3{margin:0;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:18px;padding:7px 12px;font-size:14px}
textarea{width:100%;box-sizing:border-box;min-height:84px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--sunk);font-size:16px;resize:vertical}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--sunk);font-size:16px;min-width:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:14px;line-height:1}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* plan */
.planbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.planbar .zoom{display:flex;gap:4px;margin-left:auto}
.planbar .zoom button{width:44px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.planbox{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:70vh;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
.planwrap{position:relative;display:inline-block;vertical-align:top}
.planwrap img{display:block;max-width:none}
.hs{position:absolute;padding:0;border:2px solid #1b5bc9;background:rgba(27,91,201,.10);border-radius:3px;box-sizing:border-box}
.hs.col{border-radius:50%}
.hs[data-s="part"]{background:rgba(27,91,201,.28)}
.hs[data-s="done"]{border-color:#17834a;background:rgba(23,131,74,.30)}
.hs[data-s="ng"]{border-color:#cf3527;background:rgba(207,53,39,.30)}
.hs:active{background:rgba(27,91,201,.5)}
.hs.focus{outline:3px solid #f2a100;outline-offset:3px;z-index:2}
.picking .hs{pointer-events:none;opacity:.35}
@media (prefers-reduced-motion:no-preference){.hs.focus{animation:blink 1s ease-in-out 3}@keyframes blink{50%{outline-color:transparent}}}
.mbtn.flash{outline:3px solid #f2a100;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.mbtn.flash{animation:blink 1s ease-in-out 3}}
.pin{z-index:3;position:absolute;transform:translate(-50%,-100%);background:var(--ng);color:#fff;font-family:var(--f-num);font-weight:700;font-size:15px;min-width:26px;height:26px;border-radius:13px 13px 13px 2px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);padding:0 4px}
.pin.done{background:var(--ok)}
.pickmsg{background:var(--ng);color:#fff;border-radius:var(--r);padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pickmsg button{background:#fff;color:var(--ng);border:0;border-radius:8px;padding:6px 10px;font-weight:700}

/* findings */
.find{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ng);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px}
.find.done{border-left-color:var(--ok)}
.find-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.find-h .no{font-family:var(--f-num);font-weight:700;font-size:22px;color:var(--ng)}
.find.done .find-h .no{color:var(--ok)}
.find-h .where{font-weight:700}
.find-h .stat{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--ng-soft);color:var(--ng);font-weight:700}
.find.done .find-h .stat{background:var(--ok-soft);color:var(--ok)}
.find p{margin:0;white-space:pre-wrap}
.find .acts{display:flex;gap:8px;flex-wrap:wrap}
.find .acts button{font-size:13px;padding:7px 10px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r)}

/* report sheet */
.headform{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.headform .wide{grid-column:1/-1}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.rep{border-collapse:collapse;font-size:12px;white-space:nowrap}
table.rep th,table.rep td{border:1px solid var(--line);padding:3px 5px;text-align:center}
table.rep thead th{background:var(--sunk);font-family:var(--f-num);font-size:14px;font-weight:600}
table.rep th.l{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:400}
table.rep td.ok{color:var(--ok);font-weight:700}
table.rep td.ng{color:#fff;background:var(--ng);font-weight:700}
table.rep td.na{color:var(--na)}
table.fl{border-collapse:collapse;width:100%;font-size:13px}
table.fl th,table.fl td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;text-align:left}
table.fl th{background:var(--sunk);font-weight:700;white-space:nowrap}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:20px;font-size:14px;z-index:60}
.refs{display:grid;gap:10px}
.refs section{background:var(--sunk);border-radius:8px;padding:8px 10px}
.refs h4{margin:0 0 4px;font-size:13px}
.refs ul{margin:0;padding-left:1.1em;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head><body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <select id="insp-select" aria-label="検査箇所"></select>
    </div>
    <div class="bar" id="topbar" aria-hidden="true"></div>
    <div class="top-meta" id="topmeta"></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="list"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>部材</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>図面</button>
    <button data-tab="finds"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg><span>指摘 <span id="fbadge"></span></span></button>
    <button data-tab="sheet"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>帳票</button>
  </nav>
</div>
<div id="overlay"></div>

<script async src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
"use strict";
/* ===== データ（データファイル .json から読み込む。build.py が project_*.py から作る） ===== */
let DATA=null, PROJECT={id:"",name:"",short:""};
let SLAB={}, BEAM={}, COL={}, WALL={}, REFS=[], LIST_PAGES={}, SECT={}, GRID={}, INSPECTIONS=[];
function applyData(ds){
  DATA=ds; PROJECT=ds.project;
  ({slab:SLAB, beam:BEAM, col:COL, wall:WALL}=ds.masters);
  REFS=ds.refs.default||[]; LIST_PAGES=ds.listPages||{}; SECT=ds.sect||{}; GRID=ds.grid||{};
  INSPECTIONS=ds.inspections.map(i=>Object.assign({},i,{
    plan:ds.plans[i.plan], refs:i.refs?ds.refs[i.refs]:null, mst:i.mst?ds.mstSets[i.mst]:null,
    members:i.members.map(m=>Object.assign({uid:m.t+"|"+m.sym+"|"+m.loc},m))}));
  document.title="配筋検査 "+PROJECT.short;
}

/* ===== 確認項目（現行帳票の行構成） ===== */
const SPEC = {
  slab:{label:"耐圧盤", groups:[
    {g:"厚さ", items:["厚さ"], dv:m=>m.t},
    {g:"主筋・配力筋", items:["方向","径","ピッチ","2段筋レベル","継手","定着"]},
    {g:"補強筋", items:["補強筋"]},
    {g:"共通", items:["鉄筋のあき","かぶり厚さ"]}],
    design:m=>[["版厚",m.t],["上端 主筋",m.tm],["上端 配力",m.td],["下端 主筋",m.bm],["下端 配力",m.bd]]},
  beam:{label:"地中梁", groups:[
    {g:"断面サイズ", items:["幅","高さ"], dv:m=>m.bd},
    {g:"主筋", items:["径","本数","2段筋レベル","継手","定着","カットオフ"], dv:m=>"上 "+m.top+" / 下 "+m.bot},
    {g:"スタラップ", items:["径","本数","ピッチ"], dv:m=>m.stp},
    {g:"梁貫通", items:["型・径","本数","孔際補強"]},

/* 部材の図面上の範囲（% 指定）。柱＝交点、梁＝通り上のスパン中央、耐圧盤＝区画中央 */
function hotspot(gridId, m){
  const g=GRID[gridId]; if(!g) return null;
  const rng=s=>{const r=/^([XY])(\d+)(?:-(\d+))?$/.exec(s.trim()); if(!r) return null; const ax=g[r[1]], a=ax[r[2]], b=r[3]?ax[r[3]]:a; return a==null||b==null?null:{ax:r[1],a:Math.min(a,b),b:Math.max(a,b)};};
  let box;
  if(m.box) box=m.box;
  else if(m.t==="col"){ const x=rng(m.a), y=rng(m.b); if(!x||!y) return null; const s=14; box=[x.a-s,y.a-s,2*s,2*s]; }
  else if(LINE_TYPES.includes(m.t) && !m.a.includes("-")){ const line=rng(m.a), span=rng(m.b); if(!line||!span) return null; const L=(span.b-span.a)*.5, th=9;
    box= line.ax==="Y" ? [(span.a+span.b)/2-L/2, line.a-th, L, 2*th] : [line.a-th, (span.a+span.b)/2-L/2, 2*th, L]; }
  else if(m.t==="sbeam"){ const x=rng(m.a), y=rng(m.b); if(!x||!y) return null; const w=x.b-x.a, h=y.b-y.a, cx=(x.a+x.b)/2, cy=(y.a+y.b)/2, o=m.off||0;
    box= m.dir==="v" ? [cx+o*w*.22-6, y.a+h*.22, 12, h*.56] : [x.a+w*.22, cy+o*h*.22-6, w*.56, 12]; }
  else if(m.t==="floor"){ const x=rng(m.a), y=rng(m.b); if(!x||!y) return null; const w=x.b-x.a, h=y.b-y.a;
    box=[x.a+w*.14, y.a+h*.12, w*.26, h*.22]; }
  else { const x=rng(m.a), y=rng(m.b); if(!x||!y) return null; const w=(x.b-x.a)*(m.t==="wall"?.35:.55), h=(y.b-y.a)*(m.t==="wall"?.3:.42); box=[(x.a+x.b)/2-w/2,(y.a+y.b)/2-h/2,w,h]; }
  return {l:box[0]/g.W*100, t:box[1]/g.H*100, w:box[2]/g.W*100, h:box[3]/g.H*100};
}

const mem = new Map(); let idb=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("haikin-kensa",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("photos")};r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function dbGet(store,k){return new Promise(res=>{if(!idb)return res(mem.get(store+k));try{const q=idb.transaction(store).objectStore(store).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(mem.get(store+k))}catch(e){res(mem.get(store+k))}})}
function dbPut(store,k,v){mem.set(store+k,v);if(!idb)return;try{idb.transaction(store,"readwrite").objectStore(store).put(v,k)}catch(e){}}
function dbDel(store,k){mem.delete(store+k);if(!idb)return;try{idb.transaction(store,"readwrite").objectStore(store).delete(k)}catch(e){}}

/* 画面の中では部材を並び順（mi）で扱い、保存するときは部材の固有ID（uid）に変換する。
   データファイルを差し替えて部材の並びが変わっても、記録がずれないようにするため */
function toStore(){
  const out={cur:S.cur, data:{}};
  for(const [id,d] of Object.entries(S.data)){
    const ms=(INSPECTIONS.find(i=>i.id===id)||{members:[]}).members;
    const res=Object.assign({}, d.orphanRes||{});
    for(const [k,v] of Object.entries(d.res)){ const p=k.indexOf("|"), m=ms[+k.slice(0,p)]; if(m) res[m.uid+"#"+k.slice(p+1)]=v; }
    const finds=d.finds.map(f=>{ const o=Object.assign({},f); if(f.mi!=null&&ms[f.mi]) o.mu=ms[f.mi].uid; delete o.mi; return o; });
    out.data[id]={head:d.head, seq:d.seq, res, finds};
  }
  return out;
}
function fromStoreData(data){
  const out={};
  for(const [id,d] of Object.entries(data||{})){
    const ms=(INSPECTIONS.find(i=>i.id===id)||{members:[]}).members, at={}; ms.forEach((m,i)=>at[m.uid]=i);
    const res={}, orphanRes={};
    for(const [k,v] of Object.entries(d.res||{})){ const p=k.lastIndexOf("#"), mi=at[k.slice(0,p)]; if(mi!=null) res[mi+"|"+k.slice(p+1)]=v; else orphanRes[k]=v; }
    const finds=(d.finds||[]).map(f=>Object.assign({},f,{mi:at[f.mu]??null}));
    out[id]={head:d.head, seq:d.seq||0, res, finds, orphanRes};
  }
  return out;
}

/* 図面の拡大縮小：図面の枠の中だけを拡大する（画面全体は拡大しない）。
   (px, py) は枠の中の基準点。指定がなければ枠の中央を基準にする */
function planZoomTo(z, px, py){
  const box=document.querySelector(".planbox"), wrap=$("#planwrap"); if(!box||!wrap) return;
  z=Math.max(1,Math.min(6,z));
  if(px==null){ px=box.clientWidth/2; py=box.clientHeight/2; }
  const old=UI.zoom, cx=(box.scrollLeft+px)/old, cy=(box.scrollTop+py)/old;
  UI.zoom=z; wrap.style.width=z*100+"%";
  box.scrollLeft=cx*z-px; box.scrollTop=cy*z-py;
}
function attachPlanGestures(){
  const box=document.querySelector(".planbox"); if(!box) return;
  let pin=null;
  const mid=(t)=>{ const r=box.getBoundingClientRect(); return {x:(t[0].clientX+t[1].clientX)/2-r.left, y:(t[0].clientY+t[1].clientY)/2-r.top, d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}; };
  box.addEventListener("touchstart",e=>{ if(e.touches.length===2){ const m=mid(e.touches); pin={d:m.d, z:UI.zoom}; } },{passive:true});
  box.addEventListener("touchmove",e=>{ if(pin && e.touches.length===2){ e.preventDefault(); const m=mid(e.touches); planZoomTo(pin.z*m.d/pin.d, m.x, m.y); } },{passive:false});
  box.addEventListener("touchend",e=>{ if(e.touches.length<2) pin=null; });
  /* iPhone の Safari は gesture イベントで画面全体を拡大するので止める */
  ["gesturestart","gesturechange","gestureend"].forEach(ev=>box.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  /* パソコン：タッチパッドのピンチ（Ctrl＋ホイール） */
  box.addEventListener("wheel",e=>{ if(!e.ctrlKey) return; e.preventDefault(); const r=box.getBoundingClientRect(); planZoomTo(UI.zoom*Math.exp(-e.deltaY*0.01), e.clientX-r.left, e.clientY-r.top); },{passive:false});
}

  return `<article class="find ${f.status==="done"?"done":""}">
   <div class="find-h"><span class="no">${f.no}</span><span class="where">${m?esc(m.sym+"　"+m.loc):"全般"}</span><span class="note">${esc(f.item?f.item.replace("/"," ・ "):"")}</span><span class="stat">${f.status==="done"?"是正確認 "+esc(md(f.doneDate)):"未是正"}</span></div>
   <p>${esc(f.text)}</p>
   ${f.photos.length?`<div class="thumbs">${f.photos.map(p=>`<figure><img data-photo="${p}" alt="指摘${f.no}の写真"></figure>`).join("")}</div>`:""}
   ${f.status==="done"?`<div class="note">確認方法：${esc(f.method||"")}</div>`:""}
   <div class="acts"><button class="btn" data-act="editfind" data-id="${f.id}">編集</button>${f.status==="done"?`<button class="btn" data-act="undone" data-id="${f.id}">未是正に戻す</button>`:`<button class="btn primary" data-act="done" data-id="${f.id}">是正確認した</button>`}${f.pin?`<button class="btn" data-act="showpin" data-id="${f.id}">図面で見る</button>`:""}</div>

}
function viewFinds(){
  const d=D();
  if(!d.finds.length) return `<div class="empty">指摘はまだありません。<br>部材カードで「×」を押すと、ここに番号付きで追加されます。</div>`;
  const open=d.finds.filter(f=>f.status!=="done"), done=d.finds.filter(f=>f.status==="done");
  return (open.length?`<section class="sec"><h2><span>未是正</span><span class="num">${open.length}</span></h2><div style="display:grid;gap:10px">${open.map(findCard).join("")}</div></section>`:"")+
         (done.length?`<section class="sec"><h2><span>是正確認済み</span><span class="num">${done.length}</span></h2><div style="display:grid;gap:10px">${done.map(findCard).join("")}</div></section>`:"");
}

async function drawSheetThumbs(){
  const box=$("#fs-thumbs"); if(!box) return;
  const arr=[]; for(const id of UI.draft.photos){ arr.push(`<figure><img src="${await photo(id)||""}" alt="写真"><button data-act="rmphoto" data-id="${id}" aria-label="写真を外す">×</button></figure>`); }
  box.innerHTML=arr.join("");
}
function shrink(file){
  return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=1280,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72))};im.onerror=()=>res(r.result);im.src=r.result};r.readAsDataURL(file)});
}
/* ===== 断面リストの窓・全画面ビューアー ===== */
function sectFor(m){ const d=(insp().sect&&insp().sect[m.t])||SECT[m.t]; return d&&d[m.sym]||null; }
function fitSectWindows(){
  document.querySelectorAll(".sectwin").forEach(el=>{
    const m=insp().members[+el.dataset.i], r=sectFor(m); if(!r) return; const pg=LIST_PAGES[r[0]];
    const W=el.clientWidth, H=el.clientHeight, rw=r[3]-r[1], rh=r[4]-r[2];
    const s=Math.min(W/rw,(H-18)/rh)*0.94, L=W/2-(r[1]+rw/2)*s, T=(H-18)/2-(r[2]+rh/2)*s;
    el.querySelectorAll("img,.frame").forEach(x=>x.remove());
    const img=new Image(); img.src=pg.img; img.alt=""; img.style.width=pg.w*s+"px"; img.style.left=L+"px"; img.style.top=T+"px";
    const fr=document.createElement("span"); fr.className="frame"; Object.assign(fr.style,{left:(r[1]*s+L-2)+"px",top:(r[2]*s+T-2)+"px",width:(rw*s+4)+"px",height:(rh*s+4)+"px"});
    el.prepend(img,fr);
  });
}
let SV=null;
function openSectViewer(m){
  const r=sectFor(m); if(!r) return; const pg=LIST_PAGES[r[0]];
  $("#overlay").innerHTML=`<div class="sv" role="dialog" aria-modal="true" aria-label="断面リスト">
    <div class="sv-bar"><b>${esc(pg.title)}　${esc(m.sym)}</b><button data-act="svzoom" data-z="-1" aria-label="縮小">－</button><button data-act="svzoom" data-z="1" aria-label="拡大">＋</button><button data-act="svall">全体</button><button data-act="svfit">部材</button><button data-act="svclose">閉じる</button></div>
    <div class="sv-box" id="svbox"><div class="sv-wrap" id="svwrap"><img id="svimg" alt="${esc(pg.title)}"><span class="frame" id="svframe"></span></div></div>
    <div class="sv-hint">2本指で断面リストだけを拡大・縮小できます。指でずらすと隣の部材も見られます。</div></div>`;
  $("#svimg").src=pg.img;
  SV={r,pg,z:1}; svFit();
  const box=$("#svbox"); let pin=null;
  const mid=(t)=>{ const rc=box.getBoundingClientRect(); return {x:(t[0].clientX+t[1].clientX)/2-rc.left, y:(t[0].clientY+t[1].clientY)/2-rc.top, d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}; };
  box.addEventListener("touchstart",e=>{ if(e.touches.length===2){ pin={d:mid(e.touches).d, z:SV.z}; } },{passive:true});
  box.addEventListener("touchmove",e=>{ if(pin && e.touches.length===2){ e.preventDefault(); const p=mid(e.touches); svZoomAt(pin.z*p.d/pin.d, p.x, p.y); } },{passive:false});
  box.addEventListener("touchend",e=>{ if(e.touches.length<2) pin=null; });
  /* iPhone の Safari は gesture イベントで画面全体を拡大するので止める */
  ["gesturestart","gesturechange","gestureend"].forEach(ev=>box.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
  /* パソコン：タッチパッドのピンチ（Ctrl＋ホイール） */
  box.addEventListener("wheel",e=>{ if(!e.ctrlKey) return; e.preventDefault(); const rc=box.getBoundingClientRect(); svZoomAt(SV.z*Math.exp(-e.deltaY*0.01), e.clientX-rc.left, e.clientY-rc.top); },{passive:false});
}
/* (px, py) を基準点にして拡大縮小する（基準点の下の図は動かない）。指定がなければ表示の中央 */
function svZoomAt(z, px, py){
  const box=$("#svbox"); if(px==null){ px=box.clientWidth/2; py=box.clientHeight/2; }
  const cx=(box.scrollLeft+px)/SV.z, cy=(box.scrollTop+py)/SV.z;
  svApply(z); box.scrollLeft=cx*SV.z-px; box.scrollTop=cy*SV.z-py;
}
function svApply(z){
  const box=$("#svbox"), {r,pg}=SV; const zmin=Math.min(box.clientWidth/pg.w, box.clientHeight/pg.h)*0.98;
  SV.z=z=Math.max(zmin,Math.min(4,z));
  const wrap=$("#svwrap"); wrap.style.width=pg.w*z+"px"; wrap.style.height=pg.h*z+"px"; $("#svimg").style.width=pg.w*z+"px";
  Object.assign($("#svframe").style,{left:(r[1]*z-3)+"px",top:(r[2]*z-3)+"px",width:((r[3]-r[1])*z+6)+"px",height:((r[4]-r[2])*z+6)+"px"});
}
function svFit(){
  const box=$("#svbox"), {r}=SV, rw=r[3]-r[1], rh=r[4]-r[2];
  svApply(Math.min(box.clientWidth/rw, box.clientHeight/rh)*0.9);
  box.scrollLeft=(r[1]+rw/2)*SV.z-box.clientWidth/2; box.scrollTop=(r[2]+rh/2)*SV.z-box.clientHeight/2;
}
function svZoom(dir){ svZoomAt(SV.z*Math.pow(1.5,dir)); }
function svAll(){ svApply(0); const box=$("#svbox"); box.scrollLeft=0; box.scrollTop=0; }   /* ページ全体（svApply が最小倍率に丸める） */
window.addEventListener("resize",()=>{ fitSectWindows(); });

function newDraft(mi,item){
  const d=D();
  return {id:"f"+Date.now(), no:d.seq+1, mi, item, text:"", photos:[], pin:null, status:"open", isNew:true, prev:item?d.res[mi+"|"+item]:undefined};
}
function commitDraft(){
  const d=D(), dr=UI.draft; if(!dr) return;
  const rec={id:dr.id,no:dr.no,mi:dr.mi,item:dr.item,text:dr.text.trim(),photos:dr.photos,pin:dr.pin,status:dr.status,doneDate:dr.doneDate,method:dr.method};
  const i=d.finds.findIndex(f=>f.id===dr.id);
  if(i>=0) d.finds[i]=rec; else { d.finds.push(rec); d.seq=Math.max(d.seq,dr.no); }
  if(dr.item) d.res[dr.mi+"|"+dr.item]="ng";
  UI.draft=null; save();
}

  }

    const s=memberStat(UI.card); toast(ms[UI.card].sym+"　"+(s.s==="ng"?"指摘あり":"完了"));

  if(a==="addfind"){ openFindSheet(newDraft(UI.card,null)); return; }

  if(a==="svclose"){ $("#overlay").innerHTML=""; return; }

  if(a==="fclose"){ closeSheet(); return; }
  if(a==="q"){ const t=$("#fs-text"); const add=el.dataset.q; t.value = t.value ? t.value.replace(/\s*$/,"")+(/[。、]$/.test(t.value.trim())?"":"。")+add : add; UI.draft.text=t.value; return; }
  if(a==="rmphoto"){ UI.draft.photos=UI.draft.photos.filter(p=>p!==el.dataset.id); drawSheetThumbs(); return; }
  if(a==="fsave"){ commitDraft(); closeSheet(); render(); toast("指摘を保存しました"); return; }
  if(a==="fcancel"){ cancelDraft(); return; }
  if(a==="fdelete"){ if(!UI.delArm){UI.delArm=true; el.textContent="本当に削除する"; return;} d.finds=d.finds.filter(f=>f.id!==UI.draft.id); UI.draft=null; save(); closeSheet(); render(); toast("指摘を削除しました"); return; }
  if(a==="pickpin"){ UI.pick={returnTab:UI.tab}; closeSheet(); UI.tab="plan"; render(); return; }

  if(a==="zoom"){ planZoomTo(UI.zoom*Math.pow(1.5,+el.dataset.z)); return; }

});
function cancelDraft(){
  const dr=UI.draft, d=D();
  if(dr && dr.isNew && dr.item){ if(dr.prev) d.res[dr.mi+"|"+dr.item]=dr.prev; else delete d.res[dr.mi+"|"+dr.item]; save(); }
  UI.draft=null; closeSheet(); render();
}
document.addEventListener("click", e=>{

});

function toCSV(){
  const d=D(), ms=insp().members, mark={ok:"✓",ng:"×",na:"－"}, out=[];
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  out.push(["検査箇所",insp().place,"検査日",d.head.date,"検査方法",d.head.method,"監理担当者",d.head.kanri,"現場担当者",d.head.genba].map(q).join(","));
  typesHere().forEach(t=>{
    const idx=ms.map((m,i)=>m.t===t?i:-1).filter(i=>i>=0);
    out.push(""); out.push([SPEC[t].label+" 符号",...idx.map(i=>ms[i].sym)].map(q).join(","));
    out.push(["位置",...idx.map(i=>ms[i].loc)].map(q).join(","));
    itemKeys(t).forEach(k=>out.push([k,...idx.map(i=>mark[d.res[i+"|"+k]]||"")].map(q).join(",")));
  });
  out.push(""); out.push(["No","符号","位置","項目","指摘事項・処理方法","判定","確認日","確認方法"].map(q).join(","));
  d.finds.forEach(f=>{const m=ms[f.mi]||{};out.push([f.no,m.sym,m.loc,f.item,f.text,f.status==="done"?"OK":"",f.status==="done"?f.doneDate:"",f.method||""].map(q).join(","))});
  return out.join("\n");
}

function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"_"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")}
async function saveFile(name, blob){
  let dl=null;
  try{ if(window.claude && window.claude.use) dl=await window.claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:blob}); toast("保存しました"); }
    catch(e){ if(e && e.code==="declined") return; toast("保存できませんでした（"+(e&&e.code||"error")+"）"); }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},3000); toast("保存しました");
}
async function exportBackup(){
  const ids=new Set(); Object.values(S.data).forEach(d=>d.finds.forEach(f=>f.photos.forEach(p=>ids.add(p))));

  const body=JSON.stringify({app:"haikin-kensa",version:2,project:PROJECT.id,saved:new Date().toISOString(),data:toStore().data,photos});

}

function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;})}
async function planWithPins(){
  const i=insp(), d=D(), im=await loadImg(i.plan);
  const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight; const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0);
  const r=Math.max(11, c.width/70);
  d.finds.filter(f=>f.pin).forEach(f=>{const x=f.pin.x/100*c.width, y=f.pin.y/100*c.height;
    g.fillStyle=f.status==="done"?"#17834a":"#cf3527"; g.strokeStyle="#fff"; g.lineWidth=3;
    g.beginPath(); g.arc(x,y-r,r,0,Math.PI*2); g.fill(); g.stroke();
    g.fillStyle="#fff"; g.font="bold "+Math.round(r*1.2)+"px sans-serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText(String(f.no),x,y-r+1);});
  return {url:c.toDataURL("image/png"), w:c.width, h:c.height};
}
async function exportXlsx(btn){
  if(!window.ExcelJS){ toast("Excel作成の部品を読み込み中です。電波のある場所で少し待ってから押してください"); return; }
  const old=btn.textContent; btn.disabled=true; btn.textContent="作成中…";
  try{
    const i=insp(), d=D(), h=d.head, ms=i.members, mark={ok:"✓",ng:"×",na:"－"};
    const wb=new ExcelJS.Workbook(); wb.creator="配筋検査アプリ";
    const thin={style:"thin",color:{argb:"FF8C96A0"}}, B={top:thin,left:thin,bottom:thin,right:thin};
    const hdrFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE3ECFB"}}, ngFill={type:"pattern",pattern:"solid",fgColor:{argb:"FFFDE5E2"}};
    const font={name:"游ゴシック",size:10};
    /* 1. 検査帳票 */
    const ws=wb.addWorksheet("検査帳票",{pageSetup:{paperSize:8,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
    ws.getColumn(1).width=12; ws.getColumn(2).width=16;
    ws.mergeCells("A1:J1"); ws.getCell("A1").value="監理者（構造）配筋検査帳票　"+i.title; ws.getCell("A1").font={name:"游ゴシック",size:14,bold:true};
    const info=[["工事名称",PROJECT.name],["検査箇所",i.place],["検査日",h.date],["検査方法",h.method],["監理担当者",h.kanri],["現場担当者",h.genba],["是正確認者",h.zesei]];
    info.forEach(([k,v],j)=>{const r=ws.getRow(3+j); r.getCell(1).value=k; r.getCell(1).fill=hdrFill; r.getCell(1).border=B; ws.mergeCells(3+j,2,3+j,8); r.getCell(2).value=v||""; r.getCell(2).border=B; r.font=font;});
    let row=3+info.length+1;
    const anyRec=ms.some((m,mi)=>itemKeys(m.t).some(k=>d.res[mi+"|"+k]));
    for(const t of typesHere()){
      let idx=ms.map((m,mi)=>m.t===t?mi:-1).filter(mi=>mi>=0);
      if(anyRec) idx=idx.filter(mi=>itemKeys(t).some(k=>d.res[mi+"|"+k]) || d.finds.some(f=>f.mi===mi));
      if(!idx.length) continue;
      const title=ws.getRow(row); title.getCell(1).value=SPEC[t].label+"（"+idx.length+"部材）"; title.getCell(1).font={name:"游ゴシック",size:11,bold:true}; row++;
      const r1=ws.getRow(row), r2=ws.getRow(row+1);
      ws.mergeCells(row,1,row,2); r1.getCell(1).value="符号"; ws.mergeCells(row+1,1,row+1,2); r2.getCell(1).value="位置";
      idx.forEach((mi,k)=>{ const c=3+k; ws.getColumn(c).width=Math.max(ws.getColumn(c).width||0,10);
        r1.getCell(c).value=ms[mi].sym; r1.getCell(c).font={name:"游ゴシック",size:10,bold:true}; r2.getCell(c).value=ms[mi].loc.replace("通り ","\n"); r2.getCell(c).alignment={wrapText:true,horizontal:"center",vertical:"middle"}; });
      r2.height=28;
      [r1,r2].forEach(r=>{ for(let c=1;c<=2+idx.length;c++){ const cell=r.getCell(c); cell.border=B; cell.fill=hdrFill; if(!cell.font||!cell.font.bold) cell.font=font; if(c>2&&r===r1) cell.alignment={horizontal:"center"}; } });
      row+=2;
      SPEC[t].groups.forEach(g=>{ const start=row;
        g.items.forEach(it=>{ const k=g.g+"/"+it, r=ws.getRow(row); r.getCell(2).value=it; r.getCell(2).border=B; r.getCell(2).font=font;
          idx.forEach((mi,j)=>{ const v=d.res[mi+"|"+k]; const cell=r.getCell(3+j); cell.value=mark[v]||""; cell.border=B; cell.alignment={horizontal:"center"};
            cell.font={name:"游ゴシック",size:11,bold:v==="ng",color:{argb:v==="ng"?"FFCF3527":v==="ok"?"FF17834A":"FF7B8692"}}; if(v==="ng") cell.fill=ngFill; });
          row++; });
        ws.mergeCells(start,1,row-1,1); const gc=ws.getCell(start,1); gc.value=g.g; gc.border=B; gc.font=font; gc.alignment={vertical:"middle",wrapText:true};
      });
      row++;
    }
    /* 2. 指摘事項 */
    const wf=wb.addWorksheet("指摘事項",{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0}});
    wf.columns=[{header:"No",width:5},{header:"符号",width:9},{header:"位置",width:16},{header:"項目",width:16},{header:"指摘事項・処理方法",width:48},{header:"判定",width:6},{header:"確認日",width:11},{header:"確認方法",width:14}];
    d.finds.forEach(f=>{const m=ms[f.mi]||{}; wf.addRow([f.no,m.sym||"",m.loc||"",(f.item||"").replace("/"," "),f.text,f.status==="done"?"OK":"",f.status==="done"?f.doneDate:"",f.status==="done"?f.method:""]);});
    wf.eachRow((r,n)=>{ r.eachCell({includeEmpty:true},c=>{c.border=B; c.font=n===1?{name:"游ゴシック",size:10,bold:true}:font; c.alignment={vertical:"top",wrapText:true}; if(n===1) c.fill=hdrFill;}); });
    /* 3. 写真 */
    const wp=wb.addWorksheet("写真",{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0}});
    wp.getColumn(1).width=6; wp.getColumn(2).width=50; wp.getColumn(3).width=40;
    let pr=1; wp.getRow(pr).values=["No","写真","部材・指摘内容"]; wp.getRow(pr).eachCell(c=>{c.font={name:"游ゴシック",size:10,bold:true};c.fill=hdrFill;c.border=B}); pr++;
    for(const f of d.finds){ const m=ms[f.mi]||{};
      for(const pid of f.photos){ const url=await photo(pid); if(!url) continue; const im=await loadImg(url);
        const w=340, hgt=Math.round(w*im.naturalHeight/im.naturalWidth);
        const id=wb.addImage({base64:url,extension:"jpeg"});
        const r=wp.getRow(pr); r.height=hgt*0.75+8; r.getCell(1).value=f.no; r.getCell(3).value=(m.sym||"")+" "+(m.loc||"")+"\n"+(f.item||"").replace("/"," ")+"\n"+f.text+(f.status==="done"?"\n是正確認 "+f.doneDate:"");
        [1,2,3].forEach(c=>{r.getCell(c).border=B; r.getCell(c).alignment={vertical:"top",wrapText:true}; r.getCell(c).font=font;});
        wp.addImage(id,{tl:{col:1.05,row:pr-1+0.05},ext:{width:w,height:hgt},editAs:"oneCell"}); pr++; } }
    if(pr===2) wp.getCell("B2").value="写真なし";
    /* 4. キープラン */
    const wk=wb.addWorksheet("キープラン",{pageSetup:{paperSize:8,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:1}});
    wk.getCell("A1").value=i.title+"　キープラン（赤：未是正　緑：是正確認済み）"; wk.getCell("A1").font={name:"游ゴシック",size:12,bold:true};
    const pl=await planWithPins(); const pid=wb.addImage({base64:pl.url,extension:"png"}); const pw=1100;
    wk.addImage(pid,{tl:{col:0,row:1.2},ext:{width:pw,height:Math.round(pw*pl.h/pl.w)}});
    const buf=await wb.xlsx.writeBuffer();
    await saveFile("配筋検査帳票_"+i.title.replace(/\s+/g,"")+"_"+(h.date||"").replace(/-/g,"")+".xlsx", new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  }catch(e){ console.error(e); toast("Excelを作成できませんでした："+(e&&e.message||e)); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
function copyText(t){
  const fallback=()=>{const o=$("#overlay");o.innerHTML=`<div class="scrim" data-act="sheetbg"><div class="sheet"><h3>CSV</h3><p class="note">自動コピーできませんでした。全選択してコピーしてください。</p><textarea id="csvbox" style="min-height:220px">${esc(t)}</textarea><button class="btn primary" data-act="fclose">閉じる</button></div></div>`;const b=$("#csvbox");b.focus();b.select();};
  try{ navigator.clipboard.writeText(t).then(()=>toast("CSVをコピーしました"),fallback); }catch(e){ fallback(); }
}
